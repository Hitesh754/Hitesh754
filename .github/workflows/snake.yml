name: generate snake

on:
  # every 24 hours
  schedule:
    - cron: "0 */24 * * *"
  # run it by hand from the Actions tab
  workflow_dispatch:
  # and on every push to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate the snake svg (black + green)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#7ee787&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: push it to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="t d">
  <title id="t">Hitesh Choudhary — software developer, systems tinkerer, AI/ML explorer</title>
  <desc id="d">A dark terminal window showing the command whoami, followed by the name Hitesh Choudhary and the roles software developer, systems tinkerer and AI/ML explorer.</desc>
  <style>
    .mono { font-family: 'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#151b21" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b0e11" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0e11" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="0.5" y="0.5" width="999" height="339" rx="14" fill="#0b0e11" stroke="#222a32"/>
  <rect x="1" y="41" width="998" height="298" fill="url(#grid)"/>
  <rect x="600" y="41" width="399" height="298" fill="url(#fade)"/>

  <!-- title bar -->
  <path d="M1 41V15a14 14 0 0 1 14-14h970a14 14 0 0 1 14 14v26z" fill="#10151a"/>
  <line x1="1" y1="41" x2="999" y2="41" stroke="#222a32"/>
  <circle cx="26" cy="21" r="6" fill="#39d353"/>
  <circle cx="48" cy="21" r="6" fill="#2b333b"/>
  <circle cx="70" cy="21" r="6" fill="#2b333b"/>
  <text x="500" y="26" text-anchor="middle" class="mono" font-size="13" fill="#6e7781">hitesh754@github: ~</text>

  <!-- prompt -->
  <text x="48" y="96" class="mono" font-size="22" fill="#39d353">$</text>
  <text x="74" y="96" class="mono" font-size="22" fill="#8b949e">whoami</text>

  <!-- name -->
  <text x="48" y="176" class="mono" font-size="64" font-weight="700" fill="#e6edf3">Hitesh Choudhary</text>

  <!-- roles -->
  <text x="48" y="226" class="mono" font-size="24" fill="#c9d1d9">software developer<tspan fill="#39d353">  /  </tspan>systems tinkerer<tspan fill="#39d353">  /  </tspan>AI·ML explorer</text>

  <!-- sub line + cursor -->
  <text x="48" y="272" class="mono" font-size="19" fill="#6e7781"><tspan fill="#39d353">&gt;</tspan> third-year CSE · Linux · open source · learning in public</text>
  <rect class="cursor" x="48" y="288" width="12" height="22" fill="#39d353"/>

  <!-- palette strip -->
  <g>
    <rect x="852" y="298" width="16" height="16" fill="#161b22"/>
    <rect x="874" y="298" width="16" height="16" fill="#21262d"/>
    <rect x="896" y="298" width="16" height="16" fill="#30363d"/>
    <rect x="918" y="298" width="16" height="16" fill="#6e7781"/>
    <rect x="940" y="298" width="16" height="16" fill="#e6edf3"/>
    <rect x="962" y="298" width="16" height="16" fill="#39d353"/>
  </g>
</svg>
